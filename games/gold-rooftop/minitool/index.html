<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>黄金天台模拟器</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <h1>黄金天台模拟器</h1>
    <p class="sub">亏 1% = 上 1 层。填上现在的金价，看看不同价位买入的人该站在几层天台。</p>
    <div class="box">
      <div class="k">现价 元/克</div>
      <div class="v" id="cur">--</div>
      <div class="row">
        <button type="button" class="ghost step" data-step="-10">-10</button>
        <button type="button" class="ghost step" data-step="-1">-1</button>
        <button type="button" class="ghost step" data-step="1">+1</button>
        <button type="button" class="ghost step" data-step="10">+10</button>
      </div>
      <div class="row">
        <input id="curInput" type="number" inputmode="decimal" min="1" step="0.01" placeholder="输入最新金价" />
        <button type="button" id="setCur">设为现价</button>
      </div>
      <p class="note" id="snap">小工具不能联网，金价不会自动更新，请自己改成最新价。</p>
    </div>
    <div class="stage" id="stage"><canvas id="cv" height="420"></canvas></div>
    <div class="row">
      <input id="price" type="number" inputmode="decimal" min="1" step="0.01" placeholder="买入价 元/克" />
      <input id="name" type="text" maxlength="6" placeholder="昵称（可选）" />
    </div>
    <div class="row">
      <button type="button" id="add">上天台</button>
      <button type="button" id="reset" class="ghost">恢复默认</button>
    </div>
    <p class="note" id="status" role="status">正在准备…若长时间没有反应，请退出后重新打开。</p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>玩家</th><th>买入价</th><th>盈亏</th><th>位置</th><th>称号</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="note">红涨绿跌。纯属玩梗，亏了也别真上天台，下来吃顿火锅。投资有风险。</p>
  </div>
  <script defer src="./main.js"></script>
</body>
</html>
